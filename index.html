<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D6B57">
<title>بەنزین خانە</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="loading">
  <header class="top"><div class="wrap">
    <div class="top-row">
      <div><h1>بەنزین خانە</h1><div class="date" id="who"></div></div>
      <div class="top-actions">
        <span class="badge" id="sync" hidden>ئۆفلاین</span>
        <button class="btn ghost sm" id="codeBtn" data-act="changeCode" hidden>گۆڕینی کۆد</button>
      </div>
    </div>
    <p class="note" id="dayNote" style="margin-top:4px"></p>
  </div></header>
  <div class="wrap"><main id="view"></main></div>
  <nav class="tabs" aria-label="بەشەکان"><div class="in-nav">
    <button class="tab" data-act="tab" data-v="pumps"><svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M2 21h14M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3M7 8h4"/></svg>خوێندنەوە</button>
    <button class="tab" data-act="tab" data-v="tanks"><svg viewBox="0 0 24 24"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3v10c0 1.7-3.6 3-8 3s-8-1.3-8-3zM4 7c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>تانکەکان</button>
    <button class="tab" data-act="tab" data-v="credit"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 7l3-3h12l3 3M16 13h2"/></svg>قەرز</button>
    <button class="tab" data-act="tab" data-v="report"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>ڕاپۆرت</button>
  </div></nav>
  <script type="module" src="app.js"></script>
</body>
</html>
